[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aws-cost-sentinel"
version = "0.1.0"
description = "Find AWS cost waste from Cost Explorer exports or a live account, with savings estimates and CI-friendly reports."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Shailendra Singh", email = "356085194+builtbyshailendra@users.noreply.github.com" }]
keywords = ["aws", "finops", "cost", "cloud", "devops", "cost-explorer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "moto[ec2,s3,rds,elbv2,cloudwatch]>=5.0",
  "pyyaml>=6.0",
]

[project.scripts]
cost-sentinel = "cost_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/builtbyshailendra/aws-cost-sentinel"
Changelog = "https://github.com/builtbyshailendra/aws-cost-sentinel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "action/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:botocore.*",
  "ignore::DeprecationWarning:moto.*",
]

[tool.coverage.run]
source = ["cost_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "C4", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["cost_sentinel"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF012"]
